<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chỉnh sửa thông tin</title>

  <style>

    /* =========================
       GLOBAL
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family: Arial, sans-serif;

      background: #f4f6f9;

      color: #334155;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      background: linear-gradient(
              135deg,
              #1e293b,
              #334155
      );

      color: white;

      padding: 28px 20px;

      text-align: center;

      box-shadow:
              0 4px 15px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0;

      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;

      color: #cbd5e1;

      font-size: 14px;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 90%;

      max-width: 700px;

      margin: 30px auto 50px;
    }


    /* =========================
       BACK BUTTON
    ========================= */

    .back-btn {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      margin-bottom: 18px;

      padding: 9px 15px;

      background: white;

      color: #475569;

      text-decoration: none;

      border: 1px solid #cbd5e1;

      border-radius: 9px;

      font-size: 14px;

      font-weight: bold;

      transition: all 0.25s ease;
    }

    .back-btn:hover {
      background: #eff6ff;

      color: #2563eb;

      border-color: #93c5fd;

      transform: translateX(-2px);
    }


    /* =========================
       FORM CARD
    ========================= */

    .form-card {
      background: white;

      padding: 30px;

      border-radius: 16px;

      box-shadow:
              0 5px 20px rgba(0, 0, 0, 0.08);
    }


    /* =========================
       TITLE
    ========================= */

    .form-title {
      margin: 0 0 8px;

      color: #1e293b;

      font-size: 26px;
    }

    .form-description {
      margin: 0 0 25px;

      color: #64748b;

      font-size: 14px;

      line-height: 1.5;
    }


    /* =========================
       FORM GROUP
    ========================= */

    .form-group {
      margin-bottom: 20px;
    }


    .form-group label {
      display: block;

      margin-bottom: 7px;

      color: #334155;

      font-size: 14px;

      font-weight: bold;
    }


    .required {
      color: #dc2626;
    }


    /* =========================
       INPUT
    ========================= */

    .form-control {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #cbd5e1;

      border-radius: 9px;

      background: white;

      color: #1e293b;

      font-family: Arial, sans-serif;

      font-size: 14px;

      outline: none;

      transition: all 0.25s ease;
    }


    .form-control:focus {
      border-color: #2563eb;

      box-shadow:
              0 0 0 3px rgba(37, 99, 235, 0.12);
    }


    .form-control::placeholder {
      color: #94a3b8;
    }


    /* =========================
       AVATAR PREVIEW
    ========================= */

    .avatar-preview {
      display: flex;

      align-items: center;

      gap: 15px;

      margin-top: 10px;

      padding: 12px;

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 10px;
    }


    .avatar-preview img {
      width: 60px;

      height: 60px;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid #cbd5e1;
    }


    .avatar-preview span {
      color: #64748b;

      font-size: 13px;
    }


    /* =========================
       BUTTON AREA
    ========================= */

    .form-actions {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 28px;

      padding-top: 22px;

      border-top: 1px solid #e2e8f0;
    }


    /* =========================
       SAVE BUTTON
    ========================= */

    .save-btn {
      padding: 11px 22px;

      background: #2563eb;

      color: white;

      border: none;

      border-radius: 9px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      transition: all 0.25s ease;
    }


    .save-btn:hover {
      background: #1d4ed8;

      transform: translateY(-2px);

      box-shadow:
              0 6px 14px rgba(37, 99, 235, 0.25);
    }


    /* =========================
       CANCEL BUTTON
    ========================= */

    .cancel-btn {
      display: inline-block;

      padding: 10px 20px;

      background: #f1f5f9;

      color: #475569;

      border: 1px solid #cbd5e1;

      border-radius: 9px;

      text-decoration: none;

      font-size: 14px;

      font-weight: bold;

      transition: all 0.25s ease;
    }


    .cancel-btn:hover {
      background: #e2e8f0;

      color: #334155;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .container {
        width: 94%;
      }


      .form-card {
        padding: 20px;
      }


      .form-title {
        font-size: 23px;
      }


      .form-actions {
        flex-direction: column;

        align-items: stretch;
      }


      .save-btn,
      .cancel-btn {
        width: 100%;

        text-align: center;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <h1>
    📚 Online Book Reselling
  </h1>

  <p>
    Cập nhật thông tin tài khoản
  </p>

</header>


<div class="container">


  <!-- =========================
       BACK
  ========================= -->

  <a
          href="/profile"
          class="back-btn">

    ← Quay lại hồ sơ

  </a>


  <!-- =========================
       FORM CARD
  ========================= -->

  <div class="form-card">


    <h2 class="form-title">
      ✏️ Chỉnh sửa hồ sơ
    </h2>


    <p class="form-description">
      Cập nhật thông tin cá nhân của bạn bên dưới.
      Các thông tin có dấu <span class="required">*</span> là bắt buộc.
    </p>


    <!-- =========================
         FORM
    ========================= -->

    <form
            th:action="@{/profile/update}"
            method="post">


      <!-- AVATAR -->

      <div class="form-group">

        <label>
          🖼️Ảnh đại diện
        </label>

        <input
                type="text"
                name="avatar"
                th:value="${user.avatar}"
                placeholder="Dán link ảnh vào đây"
                class="form-control">


        <div
                class="avatar-preview"
                th:if="${user.avatar != null and user.avatar != ''}">

          <img
                  th:src="${user.avatar}"
                  alt="Avatar">

          <span>
                        Ảnh đại diện hiện tại
                    </span>

        </div>

      </div>


      <!-- FULL NAME -->

      <div class="form-group">

        <label>
          👤 Họ và tên
          <span class="required">*</span>
        </label>

        <input
                type="text"
                name="fullName"
                th:value="${user.fullName}"
                placeholder="Nhập họ và tên"
                class="form-control"
                required>

      </div>


      <!-- EMAIL -->

      <div class="form-group">

        <label>
          📧 Email
          <span class="required">*</span>
        </label>

        <input
                type="email"
                name="email"
                th:value="${user.email}"
                placeholder="example@gmail.com"
                class="form-control"
                required>

      </div>


      <!-- PHONE -->

      <div class="form-group">

        <label>
          📱 Số điện thoại
        </label>

        <input
                type="text"
                name="phone"
                th:value="${user.phone}"
                placeholder="Nhập số điện thoại"
                class="form-control">

      </div>


      <!-- ADDRESS -->

      <div class="form-group">

        <label>
          📍 Địa chỉ nhận hàng mặc định
        </label>

        <input
                type="text"
                name="address"
                th:value="${user.address}"
                placeholder="Nhập địa chỉ nhận hàng"
                class="form-control">

      </div>


      <!-- =========================
           ACTIONS
      ========================= -->

      <div class="form-actions">

        <button
                type="submit"
                class="save-btn">

          💾 Lưu thông tin

        </button>


        <a
                href="/profile"
                class="cancel-btn">

          Hủy bỏ

        </a>

      </div>


    </form>

  </div>

</div>


</body>

</html>
