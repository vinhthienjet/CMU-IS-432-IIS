<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chỉnh sửa thông tin</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>


<body class="page--profile-edit">


<!-- =========================
     HEADER
========================= -->

<header>

  <h1>
    📚 Online Book Reselling
  </h1>

  <p>
    Cập nhật thông tin tài khoản
  </p>

</header>


<div class="container">


  <!-- =========================
       BACK
  ========================= -->

  <a
          href="/profile"
          class="back-btn">

    ← Quay lại hồ sơ

  </a>


  <!-- =========================
       FORM CARD
  ========================= -->

  <div class="form-card">


    <h2 class="form-title">
      ✏️ Chỉnh sửa hồ sơ
    </h2>


    <p class="form-description">
      Cập nhật thông tin cá nhân của bạn bên dưới.
      Các thông tin có dấu <span class="required">*</span> là bắt buộc.
    </p>


    <!-- =========================
         FORM
    ========================= -->

    <form
            th:action="@{/profile/update}"
            method="post">


      <!-- AVATAR -->

      <div class="form-group">

        <label>
          🖼️Ảnh đại diện
        </label>

        <input
                type="text"
                name="avatar"
                th:value="${user.avatar}"
                placeholder="Dán link ảnh vào đây"
                class="form-control">


        <div
                class="avatar-preview"
                th:if="${user.avatar != null and user.avatar != ''}">

          <img
                  th:src="${user.avatar}"
                  alt="Avatar">

          <span>
                        Ảnh đại diện hiện tại
                    </span>

        </div>

      </div>


      <!-- FULL NAME -->

      <div class="form-group">

        <label>
          👤 Họ và tên
          <span class="required">*</span>
        </label>

        <input
                type="text"
                name="fullName"
                th:value="${user.fullName}"
                placeholder="Nhập họ và tên"
                class="form-control"
                required>

      </div>


      <!-- EMAIL -->

      <div class="form-group">

        <label>
          📧 Email
          <span class="required">*</span>
        </label>

        <input
                type="email"
                name="email"
                th:value="${user.email}"
                placeholder="example@gmail.com"
                class="form-control"
                required>

      </div>


      <!-- PHONE -->

      <div class="form-group">

        <label>
          📱 Số điện thoại
        </label>

        <input
                type="text"
                name="phone"
                th:value="${user.phone}"
                placeholder="Nhập số điện thoại"
                class="form-control">

      </div>


      <!-- ADDRESS -->

      <div class="form-group">

        <label>
          📍 Địa chỉ nhận hàng mặc định
        </label>

        <input
                type="text"
                name="address"
                th:value="${user.address}"
                placeholder="Nhập địa chỉ nhận hàng"
                class="form-control">

      </div>


      <!-- =========================
           ACTIONS
      ========================= -->

      <div class="form-actions">

        <button
                type="submit"
                class="save-btn">

          💾 Lưu thông tin

        </button>


        <a
                href="/profile"
                class="cancel-btn">

          Hủy bỏ

        </a>

      </div>


    </form>

  </div>

</div>


</body>

</html>
