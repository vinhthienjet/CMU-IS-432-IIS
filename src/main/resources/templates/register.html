<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Online Book Reselling</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;

            padding: 30px 20px;

            text-align: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            margin: 0;

            font-size: 30px;

            letter-spacing: 0.5px;
        }

        header p {
            margin: 8px 0 0;

            color: #cbd5e1;

            font-size: 14px;
        }


        /* =========================
           REGISTER AREA
        ========================= */

        .register-page {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .register-container {
            width: 100%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                    0 8px 25px rgba(0, 0, 0, 0.08);

            animation: fadeIn 0.4s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           TITLE
        ========================= */

        .register-title {
            text-align: center;

            margin-bottom: 28px;
        }

        .register-title .icon {
            font-size: 42px;

            margin-bottom: 8px;
        }

        .register-title h2 {
            margin: 0;

            color: #1e293b;

            font-size: 26px;
        }

        .register-title p {
            margin-top: 8px;

            color: #64748b;

            font-size: 14px;
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .message {
            padding: 11px 13px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .error {
            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           INPUT
        ========================= */

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            color: #334155;

            background: white;

            transition:
                    border-color 0.25s ease,
                    box-shadow 0.25s ease;
        }


        input:focus {
            border-color: #2563eb;

            box-shadow:
                    0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        input::placeholder {
            color: #94a3b8;
        }


        /* =========================
           PASSWORD
        ========================= */

        .input-wrapper {
            position: relative;
        }

        .password-input {
            padding-right: 45px;
        }


        /* =========================
           EYE BUTTON
        ========================= */

        .toggle-password {
            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

            color: #64748b;

            padding: 3px;

            transition:
                    color 0.2s ease,
                    transform 0.2s ease;
        }


        .toggle-password:hover {
            color: #2563eb;

            transform:
                    translateY(-50%)
                    scale(1.1);
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-button {
            width: 100%;

            padding: 12px 15px;

            margin-top: 5px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 9px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition:
                    background 0.25s ease,
                    transform 0.25s ease,
                    box-shadow 0.25s ease;
        }


        .register-button:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                    0 6px 14px rgba(37, 99, 235, 0.25);
        }


        .register-button:active {
            transform: translateY(0);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {
            text-align: center;

            margin: 22px 0 0;

            color: #64748b;

            font-size: 14px;
        }


        .login-link a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;

            transition: color 0.2s ease;
        }


        .login-link a:hover {
            color: #1d4ed8;

            text-decoration: underline;
        }


        /* =========================
           BACK HOME
        ========================= */

        .back-home {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #64748b;

            font-size: 13px;

            text-decoration: none;

            transition: color 0.2s ease;
        }


        .back-home:hover {
            color: #2563eb;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 550px) {

            .register-page {
                padding: 25px 15px;
            }

            .register-container {
                padding: 28px 22px;
            }

            header h1 {
                font-size: 25px;
            }

        }

    </style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>📚 Online Book Reselling</h1>

    <p>
        Nền tảng mua bán sách trực tuyến
    </p>

</header>


<!-- =========================
     REGISTER
========================= -->

<div class="register-page">

    <div class="register-container">


        <!-- TITLE -->

        <div class="register-title">

            <div class="icon">
                📝
            </div>

            <h2>Đăng ký thành viên</h2>

            <p>
                Tạo tài khoản để bắt đầu mua bán sách
            </p>

        </div>


        <!-- ERROR -->

        <div
                th:if="${error}"
                class="message error"
                th:text="${error}">
        </div>


        <!-- REGISTER FORM -->

        <form
                th:action="@{/register}"
                method="post">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Tên đăng nhập (*)
                </label>

                <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Mật khẩu (*)
                </label>

                <div class="input-wrapper">

                    <input
                            id="password"
                            class="password-input"
                            type="password"
                            name="password"
                            placeholder="Nhập mật khẩu"
                            required
                    >

                    <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Hiện hoặc ẩn mật khẩu">

                        👁

                    </button>

                </div>

            </div>


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Họ và tên (*)
                </label>

                <input
                        id="fullName"
                        type="text"
                        name="fullName"
                        placeholder="Nhập họ và tên"
                        required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email (*)
                </label>

                <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="Nhập địa chỉ email"
                        required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Số điện thoại
                </label>

                <input
                        id="phone"
                        type="text"
                        name="phone"
                        placeholder="Nhập số điện thoại"
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Địa chỉ
                </label>

                <input
                        id="address"
                        type="text"
                        name="address"
                        placeholder="Nhập địa chỉ"
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                    type="submit"
                    class="register-button">

                Đăng ký

            </button>

        </form>


        <!-- LOGIN -->

        <p class="login-link">

            Đã có tài khoản?

            <a href="/login">
                Đăng nhập tại đây
            </a>

        </p>


        <!-- BACK HOME -->

        <a href="/" class="back-home">
            ← Quay lại trang chủ
        </a>


    </div>

</div>


<!-- =========================
     SHOW / HIDE PASSWORD
========================= -->

<script>

    function togglePassword() {

        const passwordInput =
            document.getElementById("password");

        const toggleButton =
            document.querySelector(".toggle-password");


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            toggleButton.textContent = "🙈";

        } else {

            passwordInput.type = "password";

            toggleButton.textContent = "👁";

        }

    }

</script>


</body>
</html>
