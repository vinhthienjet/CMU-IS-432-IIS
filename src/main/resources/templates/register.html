<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Online Book Reselling</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>


<body class="page--register">


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>📚 Online Book Reselling</h1>

    <p>
        Nền tảng mua bán sách trực tuyến
    </p>

</header>


<!-- =========================
     REGISTER
========================= -->

<div class="register-page">

    <div class="register-container">


        <!-- TITLE -->

        <div class="register-title">

            <div class="icon">
                📝
            </div>

            <h2>Đăng ký thành viên</h2>

            <p>
                Tạo tài khoản để bắt đầu mua bán sách
            </p>

        </div>


        <!-- ERROR -->

        <div
                th:if="${error}"
                class="message error"
                th:text="${error}">
        </div>


        <!-- REGISTER FORM -->

        <form
                th:action="@{/register}"
                method="post">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Tên đăng nhập (*)
                </label>

                <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Mật khẩu (*)
                </label>

                <div class="input-wrapper">

                    <input
                            id="password"
                            class="password-input"
                            type="password"
                            name="password"
                            placeholder="Nhập mật khẩu"
                            required
                    >

                    <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Hiện hoặc ẩn mật khẩu">

                        👁

                    </button>

                </div>

            </div>


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Họ và tên (*)
                </label>

                <input
                        id="fullName"
                        type="text"
                        name="fullName"
                        placeholder="Nhập họ và tên"
                        required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email (*)
                </label>

                <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="Nhập địa chỉ email"
                        required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Số điện thoại
                </label>

                <input
                        id="phone"
                        type="text"
                        name="phone"
                        placeholder="Nhập số điện thoại"
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Địa chỉ
                </label>

                <input
                        id="address"
                        type="text"
                        name="address"
                        placeholder="Nhập địa chỉ"
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                    type="submit"
                    class="register-button">

                Đăng ký

            </button>

        </form>


        <!-- LOGIN -->

        <p class="login-link">

            Đã có tài khoản?

            <a href="/login">
                Đăng nhập tại đây
            </a>

        </p>


        <!-- BACK HOME -->

        <a href="/" class="back-home">
            ← Quay lại trang chủ
        </a>


    </div>

</div>


<!-- =========================
     SHOW / HIDE PASSWORD
========================= -->

<script>

    function togglePassword() {

        const passwordInput =
            document.getElementById("password");

        const toggleButton =
            document.querySelector(".toggle-password");


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            toggleButton.textContent = "🙈";

        } else {

            passwordInput.type = "password";

            toggleButton.textContent = "👁";

        }

    }

</script>


</body>
</html>
