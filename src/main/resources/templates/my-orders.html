<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng của tôi - Online Book</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>
<body class="page--my-orders">

<header>
  <div class="header-content">
    <a href="/" class="brand">
      <h1>📚 Online Book Reselling</h1>
    </a>
    <div class="header-account">
      👤 <span th:text="${session.loggedInUser != null ? session.loggedInUser.fullName : 'Tài khoản'}">Tên người dùng</span>
    </div>
  </div>
</header>

<div class="page-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3 class="sidebar-title">👤 Tài khoản</h3>
    <a class="menu-item" href="/">Trang chủ</a>
    <a class="menu-item active" href="/my-orders">🛍️ Đơn hàng của tôi</a>
  </aside>

  <!-- NỘI DUNG LỊCH SỬ MUA HÀNG -->
  <main class="content-card">
    <h2 class="orders-title">🛍️ Đơn hàng của tôi</h2>
    <p class="text-muted-sm">Theo dõi các cuốn sách bạn đã đặt mua qua hệ thống</p>

    <!-- Thông báo thành công nếu có -->
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <div class="table-wrapper">
      <table>
        <thead>
        <tr>
          <th>Mã ĐH</th>
          <th>Ngày đặt</th>
          <th>Sản phẩm</th>
          <th>SL</th>
          <th>Tổng tiền</th>
          <th>Thanh toán</th>
          <th>Trạng thái</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${orders == null or orders.isEmpty()}">
          <td colspan="7" class="empty-state">
            Bạn chưa đặt mua cuốn sách nào.
          </td>
        </tr>

        <tr th:each="order : ${orders}">
          <td th:text="'#' + ${order.id}" class="text-subtle-strong">#1</td>
          <td th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm') : 'N/A'}">Ngày</td>

          <!-- Tên sách (bấm vào xem chi tiết) -->
          <td>
            <a th:href="@{/book/{id}(id=${order.book.id})}" th:text="${order.book.title}" class="book-link">Tên sách</a>
          </td>

          <td th:text="${order.quantity}">1</td>
          <td th:text="${#numbers.formatDecimal(order.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'" class="text-danger-strong">100,000 VNĐ</td>
          <td th:text="${order.paymentMethod}">Tiền mặt</td>

          <td>
                            <span class="status"
                                  th:classappend="${order.status == 'Đang giao'} ? 'st-shipping' :
                                                 (${order.status == 'Đã giao'} ? 'st-delivered' : 'st-pending')"
                                  th:text="${order.status}">
                            </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </main>

</div>

</body>
</html>
