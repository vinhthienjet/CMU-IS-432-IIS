<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sách</title>

  <style>
    /* =========================
       GLOBAL
    ========================= */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #334155;
    }

    /* =========================
       HEADER
    ========================= */
    header {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    /* =========================
       CONTAINER
    ========================= */
    .container {
      width: 90%;
      max-width: 1100px;
      margin: 35px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    /* =========================
       PAGE TITLE
    ========================= */
    .page-title {
      margin-top: 0;
      margin-bottom: 25px;
      color: #1e293b;
      font-size: 26px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 15px;
    }

    /* =========================
       BOOK DETAIL
    ========================= */
    .book-detail {
      display: flex;
      gap: 45px;
      align-items: flex-start;
    }

    /* =========================
       IMAGE
    ========================= */
    .image-wrapper {
      width: 330px;
      flex-shrink: 0;
      padding: 10px;
      background: #f8fafc;
      border-radius: 15px;
      border: 1px solid #e2e8f0;
    }

    .book-image {
      width: 100%;
      height: 440px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    .image-wrapper:hover .book-image {
      transform: scale(1.02);
    }

    /* =========================
       INFORMATION
    ========================= */
    .info {
      flex: 1;
      min-width: 0;
    }

    .book-title {
      margin-top: 0;
      margin-bottom: 20px;
      color: #1e293b;
      font-size: 30px;
      line-height: 1.3;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 15px;
    }

    .info-label {
      min-width: 110px;
      color: #475569;
      font-weight: bold;
    }

    .info-value {
      color: #334155;
      line-height: 1.5;
    }

    /* =========================
       DESCRIPTION
    ========================= */
    .description-box {
      margin-top: 18px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      border-left: 4px solid #2563eb;
    }

    .description-title {
      margin: 0 0 8px;
      color: #334155;
      font-weight: bold;
    }

    .description {
      margin: 0;
      color: #64748b;
      line-height: 1.6;
    }

    /* =========================
       PRICE
    ========================= */
    .price {
      margin: 20px 0 10px;
      color: #e53935;
      font-size: 28px;
      font-weight: bold;
    }

    /* =========================
       QUANTITY
    ========================= */
    .stock {
      display: inline-block;
      margin-top: 5px;
      padding: 6px 10px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       SELLER
    ========================= */
    .seller {
      margin-top: 15px;
      padding: 12px 15px;
      background: #f8fafc;
      border-radius: 10px;
    }

    /* =========================
       ADD CART FORM
    ========================= */
    .add-cart-form {
      margin-top: 25px;
      padding: 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    .quantity-cart-row {
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }

    .quantity-group {
      width: 150px;
    }

    .quantity-label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 14px;
      font-weight: bold;
    }

    .quantity-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    .quantity-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* =========================
       BUTTONS
    ========================= */
    .add-cart-btn,
    .buy-btn,
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 43px;
      padding: 11px 18px;
      border-radius: 9px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .add-cart-btn {
      flex: 1;
      border: none;
      background: #2563eb;
      color: white;
    }

    .add-cart-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
    }

    .buy-btn {
      margin-top: 12px;
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
    }

    .buy-btn:hover {
      background: #15803d;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(22, 163, 74, 0.25);
    }

    .back-btn {
      margin-top: 20px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .back-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->
<header>
  <h1>📚 Online Book Reselling</h1>
  <p>Thông tin chi tiết sản phẩm</p>
</header>


<!-- =========================
     MAIN
========================= -->
<div class="container">
  <h1 class="page-title">📖 Chi tiết sách</h1>

  <div class="book-detail">
    <!-- =========================
         BOOK IMAGE
    ========================= -->
    <div class="image-wrapper">
      <img class="book-image" th:if="${book.image != null}" th:src="@{'/images/' + ${book.image}}" alt="Book Image">
    </div>

    <!-- =========================
         BOOK INFORMATION
    ========================= -->
    <div class="info">
      <h2 class="book-title" th:text="${book.title}"></h2>

      <div class="info-row">
        <span class="info-label">✍️ Tác giả:</span>
        <span class="info-value" th:text="${book.author}"></span>
      </div>

      <div class="info-row">
        <span class="info-label">🏷️ Thể loại:</span>
        <span class="info-value" th:text="${book.category.name}"></span>
      </div>

      <!-- DESCRIPTION -->
      <div class="description-box">
        <p class="description-title">📝 Mô tả</p>
        <p class="description" th:text="${book.description}"></p>
      </div>

      <!-- PRICE -->
      <p class="price" th:text="${book.price} + ' VNĐ'"></p>

      <!-- QUANTITY -->
      <span class="stock">
        📦 Còn lại: <span th:text="${book.quantity}"></span> cuốn
      </span>

      <!-- SELLER -->
      <div class="seller">
        <strong>👤 Người bán:</strong>
        <span th:text="${book.seller.fullName}"></span>
      </div>

      <!-- =========================
           ADD TO CART (THÊM VÀO GIỎ HÀNG)
      ========================= -->
      <form th:action="@{/cart/add}" method="post" class="add-cart-form">
        <input type="hidden" name="bookId" th:value="${book.id}">

        <div class="quantity-cart-row">
          <div class="quantity-group">
            <label for="quantity" class="quantity-label">Số lượng</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1" class="quantity-input" required>
          </div>
          <button type="submit" class="add-cart-btn">🛒 Thêm vào giỏ hàng</button>
        </div>
      </form>

      <!-- =========================
           MUA NGAY (GỌI POPUP THANH TOÁN)
      ========================= -->
      <button type="button" class="buy-btn" onclick="openCheckoutModal()">
        ⚡ Mua ngay
      </button>

      <!-- =========================
           BACK
      ========================= -->
      <a class="back-btn" href="/">
        ← Quay lại danh sách sản phẩm
      </a>

    </div>
  </div>
</div>

<!-- ==========================================
     POPUP CHỌN PHƯƠNG THỨC THANH TOÁN (MUA NGAY)
=========================================== -->
<div id="checkoutModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1050;">
  <div style="background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
    <h4 style="margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
      Phương thức thanh toán
    </h4>

    <!-- Form gửi dữ liệu mua ngay về /buy-now -->
    <form id="buyNowForm" th:action="@{/buy-now}" method="post" style="margin-top: 20px;">
      <input type="hidden" name="bookId" th:value="${book.id}">
      <input type="hidden" name="quantity" id="modalQuantity" value="1">

      <label style="display: block; padding: 15px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; cursor: pointer;">
        <input type="radio" name="paymentMethod" value="Tiền mặt" id="payCash" checked style="margin-right: 10px;">
        <strong style="font-size: 16px; color: #15803d;">💵 Tiền mặt</strong>
        <div style="font-size: 13px; color: #64748b; margin-left: 25px; margin-top: 5px;">Thanh toán khi nhận hàng (COD)</div>
      </label>

      <label style="display: block; padding: 15px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 25px; cursor: pointer;">
        <input type="radio" name="paymentMethod" value="Chuyển khoản" id="payBank" style="margin-right: 10px;">
        <strong style="font-size: 16px; color: #2563eb;">🏦 Chuyển khoản</strong>
        <div style="font-size: 13px; color: #64748b; margin-left: 25px; margin-top: 5px;">Thanh toán qua thẻ ATM / Ví điện tử</div>
      </label>

      <div style="display: flex; gap: 10px;">
        <button type="button" onclick="closeCheckoutModal()" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; background: white; border-radius: 8px; cursor: pointer; font-weight: bold;">
          Hủy bỏ
        </button>
        <button type="button" onclick="processPayment()" style="flex: 1; padding: 10px; border: none; background: #2563eb; color: white; border-radius: 8px; cursor: pointer; font-weight: bold;">
          Xác nhận đặt hàng
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ==========================================
     JAVASCRIPT XỬ LÝ POPUP
=========================================== -->
<script>
  function openCheckoutModal() {
    // Lấy số lượng từ ô input chính đưa vào form popup
    document.getElementById('modalQuantity').value = document.getElementById('quantity').value;
    document.getElementById('checkoutModal').style.display = 'flex';
  }

  function closeCheckoutModal() {
    document.getElementById('checkoutModal').style.display = 'none';
  }

  function processPayment() {
    const isBankTransfer = document.getElementById('payBank').checked;
    if (isBankTransfer) {
      alert("Cần liên kết ngân hàng trước!");
    } else {
      document.getElementById('buyNowForm').submit();
    }
  }
</script>

</body>
</html>
