<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sách</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/storefront.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/checkout-modal.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>

<body class="page--book-detail">

<!-- =========================
     HEADER
========================= -->
<header>
  <h1>📚 Online Book Reselling</h1>
  <p>Thông tin chi tiết sản phẩm</p>
</header>


<!-- =========================
     MAIN
========================= -->
<div class="container">
  <a class="back-btn" href="/">
    ← Quay lại danh sách sản phẩm
  </a>

  <h1 class="page-title">📖 Chi tiết sách</h1>

  <div class="book-detail">
    <!-- =========================
         BOOK IMAGE
    ========================= -->
    <div class="image-wrapper">
      <img class="book-image" th:if="${book.image != null}" th:src="@{'/images/' + ${book.image}}" alt="Book Image">
    </div>

    <!-- =========================
         BOOK INFORMATION
    ========================= -->
    <div class="info">
      <h2 class="book-title" th:text="${book.title}"></h2>

      <div class="info-row">
        <span class="info-label">✍️ Tác giả:</span>
        <span class="info-value" th:text="${book.author}"></span>
      </div>

      <div class="info-row">
        <span class="info-label">🏷️ Thể loại:</span>
        <span class="info-value" th:text="${book.category.name}"></span>
      </div>

      <!-- DESCRIPTION -->
      <div class="description-box">
        <p class="description-title">📝 Mô tả</p>
        <p class="description" th:text="${book.description}"></p>
      </div>

      <!-- PRICE -->
      <p class="price" th:text="${book.price} + ' VNĐ'"></p>

      <!-- QUANTITY -->
      <span class="stock">
        📦 Còn lại: <span th:text="${book.quantity}"></span> cuốn
      </span>

      <!-- SELLER -->
      <div class="seller">
        <strong>👤 Người bán:</strong>
        <span th:text="${book.seller.fullName}"></span>
      </div>

      <!-- =========================
           ADD TO CART (THÊM VÀO GIỎ HÀNG)
      ========================= -->
      <form th:action="@{/cart/add}" method="post" class="add-cart-form">
        <input type="hidden" name="bookId" th:value="${book.id}">

        <div class="quantity-cart-row">
          <div class="quantity-group">
            <label for="quantity" class="quantity-label">Số lượng</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1" class="quantity-input" required>
          </div>
          <button type="submit" class="add-cart-btn">🛒 Thêm vào giỏ hàng</button>
        </div>
      </form>

      <!-- =========================
           MUA NGAY (GỌI POPUP THANH TOÁN)
      ========================= -->
      <button type="button" class="buy-btn" onclick="openCheckoutModal()">
        ⚡ Mua ngay
      </button>

    </div>
  </div>
</div>

<!-- ==========================================
     POPUP CHỌN PHƯƠNG THỨC THANH TOÁN (MUA NGAY)
=========================================== -->
<div id="checkoutModal" class="checkout-modal" role="dialog" aria-modal="true" aria-labelledby="checkoutModalTitle">
  <div class="checkout-modal__dialog">
    <h4 id="checkoutModalTitle" class="checkout-modal__title">
      Phương thức thanh toán
    </h4>

    <!-- Form gửi dữ liệu mua ngay về /buy-now -->
    <form id="buyNowForm" th:action="@{/buy-now}" method="post" class="checkout-modal__form">
      <input type="hidden" name="bookId" th:value="${book.id}">
      <input type="hidden" name="quantity" id="modalQuantity" value="1">

      <label class="payment-option">
        <input type="radio" name="paymentMethod" value="Tiền mặt" id="payCash" checked>
        <strong class="payment-option__cash">💵 Tiền mặt</strong>
        <span class="payment-option__description">Thanh toán khi nhận hàng (COD)</span>
      </label>

      <label class="payment-option payment-option--last">
        <input type="radio" name="paymentMethod" value="Chuyển khoản" id="payBank">
        <strong class="payment-option__bank">🏦 Chuyển khoản</strong>
        <span class="payment-option__description">Thanh toán qua thẻ ATM / Ví điện tử</span>
      </label>

      <div class="checkout-modal__actions">
        <button type="button" class="checkout-modal__button checkout-modal__button--cancel" onclick="closeCheckoutModal()">
          Hủy bỏ
        </button>
        <button type="button" class="checkout-modal__button checkout-modal__button--confirm" onclick="processPayment()">
          Xác nhận đặt hàng
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ==========================================
     JAVASCRIPT XỬ LÝ POPUP
=========================================== -->
<script>
  function openCheckoutModal() {
    // Lấy số lượng từ ô input chính đưa vào form popup
    document.getElementById('modalQuantity').value = document.getElementById('quantity').value;
    document.getElementById('checkoutModal').style.display = 'flex';
  }

  function closeCheckoutModal() {
    document.getElementById('checkoutModal').style.display = 'none';
  }

  function processPayment() {
    const isBankTransfer = document.getElementById('payBank').checked;
    if (isBankTransfer) {
      alert("Cần liên kết ngân hàng trước!");
    } else {
      document.getElementById('buyNowForm').submit();
    }
  }
</script>

</body>
</html>
