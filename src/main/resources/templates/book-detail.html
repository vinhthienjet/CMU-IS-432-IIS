<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Chi tiết sách</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    .container {
      width: 80%;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }

    .book-detail {
      display: flex;
      gap: 40px;
    }

    .book-image {
      width: 300px;
      height: 400px;
      object-fit: cover;
    }

    .info {
      flex: 1;
    }

    .price {
      color: #e53935;
      font-size: 25px;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      margin-top: 20px;
      margin-right: 10px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .button:hover {
      background: #444;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Chi tiết sách</h1>

  <div class="book-detail">

    <div>
      <img class="book-image"
           th:if="${book.image != null}"
           th:src="@{'/images/' + ${book.image}}"
           alt="Book Image">
    </div>

    <div class="info">

      <h2 th:text="${book.title}"></h2>

      <p>
        <strong>Tác giả:</strong>
        <span th:text="${book.author}"></span>
      </p>

      <p>
        <strong>Thể loại:</strong>
        <span th:text="${book.category.name}"></span>
      </p>

      <p>
        <strong>Mô tả:</strong>
      </p>

      <p th:text="${book.description}"></p>

      <p class="price"
         th:text="${book.price} + ' VNĐ'">
      </p>

      <p>
        <strong>Số lượng:</strong>
        <span th:text="${book.quantity}"></span>
      </p>

      <p>
        <strong>Người bán:</strong>
        <span th:text="${book.seller.fullName}"></span>
      </p>

      <!-- Tạm thời chuyển về Login -->
      <a class="button" href="/login">
        Thêm vào giỏ hàng
      </a>

      <a class="button" href="/login">
        Mua ngay
      </a>

    </div>

  </div>

</div>

</body>
</html>
