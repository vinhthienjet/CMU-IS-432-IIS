<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng bán sách - Online Book</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>

<body class="page--seller-book-add">

<!-- ================= HEADER ================= -->

<header>

    <div class="header-content">

        <a href="/seller/products" class="brand">
            <h1>📚 Online Book Reselling</h1>
        </a>

        <div class="user-info">
            👤
            <span th:text="${session.loggedInUser.fullName}">
                Tên người bán
            </span>
        </div>

    </div>

</header>


<!-- ================= MAIN ================= -->

<div class="page-container">

    <!-- Quay lại -->

    <a href="/seller/products" class="back-link">
        ← Quay lại danh sách sách
    </a>


    <!-- ================= FORM CARD ================= -->

    <div class="form-card">

        <div class="card-header">

            <h2>📖 Đăng bán sách mới</h2>

            <p>
                Điền thông tin sách bạn muốn đăng bán trên hệ thống
            </p>

        </div>


        <div class="card-body">

            <!-- THÊM enctype="multipart/form-data" ĐỂ TRUYỀN FILE ẢNH -->
            <form th:action="@{/seller/book/add}" method="post" enctype="multipart/form-data">


                <!-- ================= THÔNG TIN CƠ BẢN ================= -->

                <div class="form-row">

                    <!-- Tên sách -->

                    <div class="form-group">

                        <label class="form-label">
                            Tên sách <span class="required">(*)</span>
                        </label>

                        <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Nhập tên cuốn sách..."
                                required
                        />

                    </div>


                    <!-- Tác giả -->

                    <div class="form-group">

                        <label class="form-label">
                            Tên tác giả <span class="required">(*)</span>
                        </label>

                        <input
                                type="text"
                                name="author"
                                class="form-control"
                                placeholder="Nhập tên tác giả..."
                                required
                        />

                    </div>

                </div>


                <!-- ================= GIÁ / SỐ LƯỢNG / THỂ LOẠI ================= -->

                <div class="form-row three-columns">

                    <!-- Giá -->

                    <div class="form-group">

                        <label class="form-label">
                            Giá tiền (VNĐ) <span class="required">(*)</span>
                        </label>

                        <input
                                type="number"
                                name="price"
                                class="form-control"
                                placeholder="VD: 50000"
                                required
                                min="0"
                                step="1000"
                        />

                    </div>


                    <!-- Số lượng -->

                    <div class="form-group">

                        <label class="form-label">
                            Số lượng <span class="required">(*)</span>
                        </label>

                        <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                placeholder="Số lượng sách"
                                required
                                min="1"
                                value="1"
                        />

                    </div>


                    <!-- Thể loại -->

                    <div class="form-group">

                        <label class="form-label">
                            Thể loại <span class="required">(*)</span>
                        </label>

                        <select
                                name="categoryId"
                                class="form-select"
                                required
                        >
                            <option value="1">
                                Lập trình (Programming)
                            </option>

                            <option value="2">
                                Giáo khoa
                            </option>

                            <option value="3">
                                Tiểu thuyết
                            </option>

                        </select>

                    </div>

                </div>


                <div class="section-divider"></div>


                <!-- ================= ẢNH (CHỌN TỪ MÁY TÍNH) ================= -->

                <div class="form-group">

                    <label class="form-label">
                        Ảnh bìa sách (Chọn từ máy tính) <span class="required">(*)</span>
                    </label>

                    <!-- THAY INPUT TEXT THÀNH INPUT FILE VÀ ĐẶT NAME LÀ imageFile -->
                    <input
                            type="file"
                            name="imageFile"
                            class="form-control field-compact"
                            accept="image/*"
                            required

                    />

                    <div class="form-hint">
                        Chọn file ảnh từ thiết bị của bạn (JPG, PNG, JPEG,...). Hệ thống sẽ tự động tải lên đám mây an toàn.
                    </div>

                </div>


                <!-- ================= MÔ TẢ ================= -->

                <div class="form-group">

                    <label class="form-label">
                        Mô tả chi tiết
                    </label>

                    <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Viết vài dòng giới thiệu về nội dung và tình trạng sách..."
                    ></textarea>

                </div>


                <!-- ================= BUTTON ================= -->

                <div class="form-actions">

                    <a
                            href="/seller/products"
                            class="btn btn-cancel"
                    >
                        Hủy bỏ
                    </a>

                    <button
                            type="submit"
                            class="btn btn-submit"
                    >
                        📚 Đăng bán sách
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
