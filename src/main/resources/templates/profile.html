<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thông tin cá nhân</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>


<body class="page--profile">


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        📚 Online Book Reselling
    </h1>

    <p>
        Quản lý thông tin tài khoản
    </p>

</header>


<div class="container">


    <!-- =========================
         BACK
    ========================= -->

    <a
            href="/"
            class="back-btn">

        ← Quay lại trang chủ

    </a>


    <!-- =========================
         PROFILE
    ========================= -->

    <div class="profile-card">


        <h2 class="profile-title">
            👤 Hồ sơ cá nhân
        </h2>


        <!-- SUCCESS -->

        <div
                th:if="${success}"
                class="success-message"
                th:text="${success}">

            Cập nhật thành công

        </div>


        <!-- =========================
             AVATAR
        ========================= -->

        <div class="avatar-section">

            <img
                    class="avatar"

                    th:src="${user.avatar != null and user.avatar != '' ? user.avatar : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"

                    alt="Avatar">

        </div>


        <!-- =========================
             INFORMATION
        ========================= -->

        <div class="info-list">


            <div class="info-row">

                <span class="info-label">
                    👤 Tên đăng nhập
                </span>

                <span
                        class="info-value"
                        th:text="${user.username}">

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    📝 Họ và tên
                </span>

                <span
                        class="info-value"
                        th:text="${user.fullName}">

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    📧 Email
                </span>

                <span
                        class="info-value"
                        th:text="${user.email}">

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    📱 Số điện thoại
                </span>

                <span
                        class="info-value"
                        th:text="${user.phone}">

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    📍 Địa chỉ
                </span>

                <span
                        class="info-value"
                        th:text="${user.address}">

                </span>

            </div>


        </div>


        <!-- =========================
             EDIT
        ========================= -->

        <div class="edit-section">

            <button
                    type="button"
                    class="edit-btn"
                    onclick="openModal()">

                ✏️ Chỉnh sửa thông tin

            </button>

        </div>


    </div>

</div>


<!-- ==================================================
     PASSWORD MODAL
================================================== -->

<div
        id="passwordModal"
        class="modal-overlay"

        th:style="${error != null ? 'display: flex;' : 'display: none;'}">


    <div class="modal-box">


        <div class="modal-icon">
            🔐
        </div>


        <h4 class="modal-title">
            Xác thực tài khoản
        </h4>


        <p class="modal-description">
            Vui lòng nhập mật khẩu để tiếp tục chỉnh sửa thông tin cá nhân.
        </p>


        <!-- ERROR -->

        <div
                th:if="${error}"
                class="error-message"
                th:text="${error}">

            Mật khẩu không chính xác

        </div>


        <!-- FORM -->

        <form
                th:action="@{/profile/verify}"
                method="post">


            <!-- PASSWORD -->

            <div class="password-wrapper">

                <input
                        id="profilePassword"
                        type="password"
                        name="password"
                        class="password-input"
                        placeholder="Nhập mật khẩu của bạn..."
                        required>


                <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        id="togglePasswordButton"
                        aria-label="Hiện mật khẩu">

                    👁

                </button>

            </div>


            <!-- ACTIONS -->

            <div class="modal-actions">


                <button
                        type="submit"
                        class="modal-btn continue-btn">

                    Tiếp tục

                </button>


                <button
                        type="button"
                        class="modal-btn cancel-btn"
                        onclick="closeModal()">

                    Hủy

                </button>


            </div>


        </form>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    function openModal() {

        document.getElementById("passwordModal").style.display = "flex";

    }


    function closeModal() {

        document.getElementById("passwordModal").style.display = "none";

    }


    function togglePassword() {

        const passwordInput =
            document.getElementById("profilePassword");

        const toggleButton =
            document.getElementById("togglePasswordButton");


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            toggleButton.textContent = "🙈";

            toggleButton.setAttribute(
                "aria-label",
                "Ẩn mật khẩu"
            );

        } else {

            passwordInput.type = "password";

            toggleButton.textContent = "👁";

            toggleButton.setAttribute(
                "aria-label",
                "Hiện mật khẩu"
            );

        }

    }

</script>


</body>

</html>
