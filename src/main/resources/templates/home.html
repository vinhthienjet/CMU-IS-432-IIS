<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Online Book Reselling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .book-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .book {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .book img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        .book h3 {
            margin-top: 15px;
        }

        .price {
            color: #e53935;
            font-size: 20px;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Online Book Reselling</h1>
    <p>Danh sách sách</p>
</header>

<div class="container">

    <h2>Tất cả sách</h2>

    <div class="book-list">

        <div class="book" th:each="book : ${books}">

            <img th:if="${book.image != null}"
                 th:src="@{'/images/' + ${book.image}}"
                 alt="Book Image">

            <h3 th:text="${book.title}"></h3>

            <p>
                Tác giả:
                <span th:text="${book.author}"></span>
            </p>

            <p>
                Thể loại:
                <span th:text="${book.category.name}"></span>
            </p>

            <p class="price"
               th:text="${book.price} + ' VNĐ'">
            </p>

            <p>
                Số lượng:
                <span th:text="${book.quantity}"></span>
            </p>

            <a class="button"
               th:href="@{'/books/' + ${book.id}}">
                Xem chi tiết
            </a>

        </div>

    </div>

</div>

</body>
</html>
