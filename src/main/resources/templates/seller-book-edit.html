<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sửa thông tin sách</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>


<body class="page--seller-book-edit">


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        📚 Online Book Reselling
    </h1>

    <p>
        Quản lý thông tin sách
    </p>

</header>


<div class="container">


    <!-- =========================
         BACK
    ========================= -->

    <a
            href="/seller/products"
            class="back-btn">

        ← Quay lại danh sách sản phẩm

    </a>


    <!-- =========================
         FORM CARD
    ========================= -->

    <div class="form-card">


        <h2 class="form-title">
            ✏️ Chỉnh sửa thông tin sách
        </h2>


        <p class="form-description">
            Cập nhật thông tin của cuốn sách bên dưới.
            Vui lòng kiểm tra lại thông tin trước khi lưu.
        </p>


        <!-- BOOK ID -->

        <div class="book-id">

            📖 Mã sách:
            <span th:text="${book.id}">
                1
            </span>

        </div>


        <!-- =========================
             FORM
        ========================= -->

        <form
                th:action="@{/seller/book/update}"
                method="post">


            <!-- Ẩn ID sách để gửi lên server -->

            <input
                    type="hidden"
                    name="id"
                    th:value="${book.id}" />


            <!-- =========================
                 TITLE
            ========================= -->

            <div class="form-group">

                <label class="form-label">

                    📚 Tên sách
                    <span class="required">(*)</span>

                </label>

                <input
                        type="text"
                        name="title"
                        class="form-control"
                        th:value="${book.title}"
                        placeholder="Nhập tên sách"
                        required />

            </div>


            <!-- =========================
                 PRICE
            ========================= -->

            <div class="form-group">

                <label class="form-label">

                    💰 Giá tiền (VNĐ)
                    <span class="required">(*)</span>

                </label>

                <input
                        type="number"
                        name="price"
                        class="form-control"
                        th:value="${book.price}"
                        placeholder="Nhập giá sách"
                        min="0"
                        required />

            </div>


            <!-- =========================
                 STATUS
            ========================= -->

            <div class="form-group">

                <label class="form-label">

                    📌 Trạng thái

                </label>

                <select
                        name="status"
                        class="form-select">

                    <option
                            value="Đang bán"
                            th:selected="${book.status == 'Đang bán'}">

                        🟢 Đang bán

                    </option>

                    <option
                            value="Đã bán"
                            th:selected="${book.status == 'Đã bán'}">

                        🔴 Đã bán

                    </option>

                </select>

                <div class="status-help">

                    Chọn trạng thái hiện tại của sản phẩm.

                </div>

            </div>


            <!-- =========================
                 DESCRIPTION
            ========================= -->

            <div class="form-group">

                <label class="form-label">

                    📝 Mô tả chi tiết

                </label>

                <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Nhập mô tả chi tiết về cuốn sách..."
                        th:text="${book.description}"></textarea>

            </div>


            <!-- =========================
                 ACTIONS
            ========================= -->

            <div class="form-actions">


                <a
                        href="/seller/products"
                        class="btn btn-back">

                    ← Quay lại

                </a>


                <button
                        type="submit"
                        class="btn btn-save">

                    💾 Lưu thay đổi

                </button>


            </div>


        </form>

    </div>

</div>


</body>

</html>
