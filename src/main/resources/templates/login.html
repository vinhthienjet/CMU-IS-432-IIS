<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>Đăng nhập</h2>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form method="post" action="/login">

        <label>Username</label>

        <input
                type="text"
                name="username"
                placeholder="Nhập username"
                required
        >

        <label>Password</label>

        <input
                type="password"
                name="password"
                placeholder="Nhập password"
                required
        >

        <button type="submit">
            Đăng nhập
        </button>

    </form>

</div>

</body>
</html>
