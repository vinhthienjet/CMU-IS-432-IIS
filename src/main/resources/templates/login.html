<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Online Book Reselling</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/typography.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/utilities.css}">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
</head>


<body class="page--login">


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>📚 Online Book Reselling</h1>

    <p>
        Nền tảng mua bán sách trực tuyến
    </p>

</header>


<!-- =========================
     LOGIN
========================= -->

<div class="login-page">

    <div class="login-container">


        <!-- TITLE -->

        <div class="login-title">

            <div class="icon">
                🔐
            </div>

            <h2>Đăng nhập</h2>

            <p>
                Đăng nhập để tiếp tục sử dụng hệ thống
            </p>

        </div>


        <!-- SUCCESS MESSAGE -->

        <div
                th:if="${success}"
                class="message success"
                th:text="${success}">
        </div>


        <!-- ERROR MESSAGE -->

        <div
                th:if="${error}"
                class="message error"
                th:text="${error}">
        </div>


        <!-- LOGIN FORM -->

        <form method="post" action="/login">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Nhập username"
                        required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                            id="password"
                            class="password-input"
                            type="password"
                            name="password"
                            placeholder="Nhập password"
                            required
                    >

                    <!-- NÚT HIỆN / ẨN PASSWORD -->

                    <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Hiện hoặc ẩn mật khẩu">

                        👁

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                    type="submit"
                    class="login-button">

                Đăng nhập

            </button>

        </form>


        <!-- REGISTER -->

        <p class="register-link">

            Chưa có tài khoản?

            <a href="/register">
                Đăng ký ngay
            </a>

        </p>


        <!-- BACK HOME -->

        <a href="/" class="back-home">
            ← Quay lại trang chủ
        </a>


    </div>

</div>


<!-- =========================
     SHOW / HIDE PASSWORD
========================= -->

<script>

    function togglePassword() {

        const passwordInput =
            document.getElementById("password");

        const toggleButton =
            document.querySelector(".toggle-password");


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            toggleButton.textContent = "🙈";

        } else {

            passwordInput.type = "password";

            toggleButton.textContent = "👁";

        }

    }

</script>


</body>
</html>
